# Configuración de sesiones de Sincro.
# El motor real se elige con CAPTIONS_ENGINE en .env (mock | gemini_live | gemini_chunk | local).
# Por defecto arranca en modo "mock" para que el proyecto funcione sin credenciales.
engine: mock
model: gemini-3.5-live-translate-preview
rest_model: gemini-3.8-flash
chunk_seconds: 4
overlap_seconds: 0.5
max_inflight: 4
latency_target_ms: 2000
native_translation: true
idle_seconds: 1.2
vad_silence_ms: 500

# No arrancar las sesiones solas: la audiencia las lanza con el botón "Ejecutar".
autostart: false

# Glosario de términos técnicos y nombres propios (se inyecta en el prompt).
glossary:
  Kubernetes: Kubernetes
  Nerdearla: Nerdearla
  open source: código abierto
  stream: transmisión

sessions:
  - id: escenario-1
    name: Escenario 1 (inglés → español)
    source:
      type: file
      url: samples/demo_en.mp4
      realtime: true
      loop: true
    source_language: en
    target_language: es
    video: /samples/demo_en.mp4

  - id: escenario-2
    name: Escenario 2 (español → inglés)
    source:
      type: file
      url: samples/demo_es.mp4
      realtime: true
      loop: true
    source_language: es
    target_language: en
    video: /samples/demo_es.mp4

  # Charla real de Nerdearla (audio por yt-dlp, video embebido de YouTube).
  # Requiere: uv pip install -r requirements-yt.txt
  - id: escenario-3
    name: Charla real (Nerdearla · YouTube)
    source:
      type: youtube
      url: https://www.youtube.com/watch?v=7rteJoZSSzo
      realtime: true
      loop: false
    source_language: en
    target_language: es
    video: https://www.youtube.com/watch?v=7rteJoZSSzo
