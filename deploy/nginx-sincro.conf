# Reverse proxy para Sincro en sincro.gscod.com
# Copiar a /etc/nginx/sites-available/sincro y enlazar en sites-enabled.
# Certificados con: sudo certbot --nginx -d sincro.gscod.com

server {
    listen 80;
    server_name sincro.gscod.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sincro.gscod.com;

    ssl_certificate     /etc/letsencrypt/live/sincro.gscod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sincro.gscod.com/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket (subtítulos en vivo)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: sin buffer y sin cortar conexiones largas
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
