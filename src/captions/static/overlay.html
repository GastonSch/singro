<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay OBS — Sincro</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: "Inter", system-ui, sans-serif; }
    #wrap {
      position: fixed; left: 4vw; right: 4vw; bottom: 6vh;
      display: flex; flex-direction: column; align-items: center; gap: .4rem;
      text-align: center;
    }
    #original {
      color: rgba(255,255,255,.82); font-size: 1.6vw;
      text-shadow: 0 2px 8px rgba(0,0,0,.9);
    }
    #translation {
      color: #fff; font-size: 3.3vw; font-weight: 700; line-height: 1.2;
      text-shadow: 0 3px 12px rgba(0,0,0,.95);
    }
    #translation:empty::after { content: ""; }
    body[data-lang="original"] #translation { display: none; }
    body[data-lang="translation"] #original { display: none; }
    #tag {
      position: fixed; top: 2vh; left: 2vw; color: rgba(255,255,255,.55);
      font-size: .9vw; letter-spacing: .08em; text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,.9);
    }
  </style>
</head>
<body data-lang="translation">
  <div id="tag"></div>
  <div id="wrap">
    <div id="original"></div>
    <div id="translation"></div>
  </div>
  <script src="/static/overlay.js"></script>
</body>
</html>
